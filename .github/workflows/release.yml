name: Release

# Publishing happens only on a version tag, never on a branch push, so a release
# is always a deliberate act.
on:
  push:
    tags:
      - "v*"
  # A dry run from the Actions tab, which builds every artifact and runs the
  # asset contract check without publishing anything.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify without publishing"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    name: release
    runs-on: ubuntu-latest

    permissions:
      # Create the release and upload assets.
      contents: write
      # Keyless signing: cosign exchanges this workflow's OIDC identity for a
      # short-lived certificate, so no signing key is stored anywhere.
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          # goreleaser builds the changelog from history, and needs the tag.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify the tree before releasing
        run: |
          # A release built from unformatted or failing code is not a release.
          go vet ./...
          go test ./...

      - name: Install cosign
        # Pinned to a full version: this action publishes no moving major tag.
        uses: sigstore/cosign-installer@v4.1.2

      # goreleaser drives cosign as a subprocess, so a change to its command
      # line surfaces as a signing failure after the whole build has run. Check
      # the flags we depend on first: cosign deprecated --output-signature and
      # --output-certificate in favour of --bundle, and that cost one release.
      - name: Check the cosign CLI supports what we use
        run: |
          set -euo pipefail
          cosign version
          for subcommand in sign-blob verify-blob; do
            if ! cosign "$subcommand" --help 2>&1 | grep -q -- '--bundle'; then
              echo "::error::cosign $subcommand does not support --bundle; .goreleaser.yaml and verify-release.yml assume it does"
              exit 1
            fi
            echo "cosign $subcommand supports --bundle"
          done

      - name: Release
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: >-
            release --clean
            ${{ github.event_name == 'workflow_dispatch' && '--snapshot --skip=publish --skip=sign' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The launchers construct a release URL from the platform and look for a
      # bare binary under an exact name, plus a file literally called
      # SHA256SUMS. Assert that against the artifacts actually produced, rather
      # than trusting the configuration to mean what it says.
      - name: Assert the launcher asset contract
        run: bash tools/check-release-assets.sh dist

  # Provenance the moment it exists: install through the documented one-liner on
  # every platform, and verify the signature a user would verify.
  verify:
    needs: release
    permissions:
      contents: read
    uses: ./.github/workflows/verify-release.yml
