# goreleaser configuration for warpbench.
#
# The single most important thing in this file is the ASSET NAMING CONTRACT.
# warpbench.sh and warpbench.ps1 construct a release URL from the platform and
# expect a bare binary named exactly:
#
#     warpbench_<os>_<arch>[.exe]      os in {linux,darwin,windows}, arch in {amd64,arm64}
#
# with no version in the filename, so that /releases/latest/download/<asset>
# resolves without knowing the tag. Every option below exists to produce that,
# and launcher_assets_test.go asserts it against a real snapshot build.

version: 2

project_name: warpbench

before:
  hooks:
    - go mod tidy
    # The embedded copies are generated from the repository-root originals, and
    # a release built from stale copies would ship a server list that does not
    # match the one in the repository.
    - go generate ./...

builds:
  - id: warpbench
    main: ./cmd/warpbench
    binary: warpbench
    env:
      # Static binaries: the launchers promise no runtime dependencies at all.
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/rpratama123/warpbench/internal/version.Version={{ .Version }}
      - -X github.com/rpratama123/warpbench/internal/version.Commit={{ .Commit }}
      - -X github.com/rpratama123/warpbench/internal/version.Date={{ .Date }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  # `formats: [binary]` publishes the executable itself rather than a tarball,
  # which is what lets a launcher fetch and run it in one step. goreleaser
  # appends .exe on Windows.
  - id: binaries
    formats: [binary]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    # Nothing else may ride along: a launcher downloads this URL and execs it.
    files:
      - none*

checksum:
  # The launchers fetch a file literally called SHA256SUMS. goreleaser's
  # default is checksums.txt, which would 404 for every user.
  name_template: SHA256SUMS
  algorithm: sha256

signs:
  # Keyless signing via Sigstore. No key is configured or stored: the workflow
  # grants an OIDC identity and cosign exchanges it for a short-lived
  # certificate, so there is no long-lived secret to leak or rotate.
  #
  # Only the checksums file is signed, which transitively covers every artifact
  # it lists -- signing each binary separately would produce twelve signatures
  # for no additional guarantee.
  - id: cosign
    cmd: cosign
    artifacts: checksum
    output: true
    args:
      - sign-blob
      - "--yes"
      # cosign v3 writes signature and certificate together into one bundle.
      # The older --output-signature / --output-certificate flags are deprecated
      # and, at the time of writing, fail with an empty bundle path.
      - "--bundle=${artifact}.bundle"
      - "${artifact}"

release:
  # `auto` marks a tag containing a pre-release suffix (v0.2.0-rc1) as a
  # pre-release, and a plain tag (v0.1.0) as a normal release. That matters:
  # the launchers request /releases/latest/download/, and GitHub's "latest"
  # endpoint excludes pre-releases, so shipping v0.1.0 as one would break every
  # install. Do not hard-code `prerelease: true` here.
  prerelease: auto
  draft: false
  footer: |
    ## Verifying this release

    Every asset is covered by `SHA256SUMS`. To check a download:

    ```sh
    sha256sum --check --ignore-missing SHA256SUMS
    ```

    `SHA256SUMS` is signed with Sigstore in keyless mode, which proves it was
    produced by this repository's release workflow. The signature and its
    certificate travel together in one bundle:

    ```sh
    cosign verify-blob \
      --bundle SHA256SUMS.bundle \
      --certificate-identity-regexp '^https://github.com/rpratama123/warpbench/' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      SHA256SUMS
    ```

    Method and results: see [`METHODOLOGY.md`](https://github.com/rpratama123/warpbench/blob/main/METHODOLOGY.md).
  extra_files:
    - glob: ./servers.json

changelog:
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Documentation
      regexp: '^.*?docs(\(.+\))??!?:.+$'
      order: 2
    - title: Other
      order: 999
  filters:
    exclude:
      - "^chore"
      - "^test"
      - "^ci"
      - "merge conflict"
      - "Merge pull request"
